name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buat folder Android
        run: flutter create . --project-name modalku --org com.modalku --platforms android

      - name: Izinkan internet (untuk font)
        run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Nama aplikasi
        run: sed -i 's|android:label="modalku"|android:label="ModalKu"|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Ikon dari logo
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ModalKu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
